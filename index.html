<style>
@font-face{font-family:"Thmanyah Sans";src:url(https://cdn.jsdelivr.net/gh/engdawood/thmanyah-font-web@4266a9d/fonts/thmanyah-sans/woff2/thmanyah-sans-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Thmanyah Sans";src:url(https://cdn.jsdelivr.net/gh/engdawood/thmanyah-font-web@4266a9d/fonts/thmanyah-sans/woff2/thmanyah-sans-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
/* Layout: one question per screen, brand header with 4-stage progress (بياناتك / التأهيل / التشخيص / الخطوة الجاية) */
:root{
  --blue:#4251B0; --green:#23B774; --ink:#323835; --bg:#F5F0E8; --card:#FFFFFF;
  --muted:#6B6F6C; --line:#E2DCD0; --chip:#EEF0FA; --chip-on:#4251B0; --chip-on-fg:#FFFFFF; --err:#C0392B;
  --font:"Thmanyah Sans","Segoe UI",Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1E2220;--card:#2A2F2C;--ink:#F2EEE6;--muted:#A9ADA9;--line:#3B413D;--chip:#323A4F;--chip-on:#6B79D6;--chip-on-fg:#FFFFFF;--err:#FF7A6B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1E2220;--card:#2A2F2C;--ink:#F2EEE6;--muted:#A9ADA9;--line:#3B413D;--chip:#323A4F;--chip-on:#6B79D6;--chip-on-fg:#FFFFFF;--err:#FF7A6B;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.6;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hero{background:linear-gradient(135deg,#4251B0 0%,#2b3480 55%,#1d6e4c 100%);color:#fff;border-radius:22px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -60px -80px auto;width:220px;height:220px;border-radius:50%;border:1px solid rgba(255,255,255,.18)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:38px;height:38px}
.brand b{letter-spacing:.12em;font-size:14px}
.brand small{display:block;font-size:11px;opacity:.75;letter-spacing:.08em}
.hero h1{margin:0;font-size:26px;line-height:1.3;text-wrap:balance}
.hero p{margin:0;opacity:.9;font-size:15px}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:relative;z-index:1}
.stage{font-size:12px;display:flex;flex-direction:column;gap:5px;opacity:.6}
.stage i{display:block;height:5px;border-radius:5px;background:rgba(255,255,255,.25);overflow:hidden}
.stage i span{display:block;height:100%;width:0;background:var(--green);transition:width .35s}
.stage.on{opacity:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 22px;display:flex;flex-direction:column;gap:16px;min-height:300px}
.qnum{font-size:13px;color:var(--muted)}
.q{margin:0;font-size:21px;line-height:1.45;text-wrap:balance}
.req{color:var(--green)}
.opts{display:grid;gap:10px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:right;width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;font-size:16px;cursor:pointer;transition:transform .12s,background .12s}
.opt:hover{transform:translateY(-1px);border-color:var(--chip-on)}
.opt small{font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg);border-color:var(--chip-on)}
.opt[aria-pressed="true"] small{color:var(--chip-on-fg);opacity:.85}
.opt:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--green);outline-offset:2px}
input,textarea{width:100%;font:inherit;font-size:17px;padding:13px 15px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.scale .opt{align-items:center;padding:12px 0;font-variant-numeric:tabular-nums}
.scale-l{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.err{color:var(--err);font-size:14px;min-height:1.2em}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:auto}
.btn{font:inherit;font-size:16px;font-weight:700;border-radius:999px;padding:12px 26px;border:0;cursor:pointer}
.btn.primary{background:var(--green);color:#fff}
.btn.ghost{background:transparent;color:var(--muted);padding-inline:8px}
.btn[disabled]{opacity:.5;cursor:wait}
.done h2{margin:0;font-size:24px;text-wrap:balance}
.done p{margin:0}
.steps{display:grid;gap:10px;padding:0;margin:0;list-style:none}
.steps li{display:flex;gap:12px;align-items:flex-start}
.steps b.n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--chip);color:var(--chip-on);display:grid;place-items:center;font-size:14px}
.wa{display:flex;flex-direction:column;gap:10px}
.wa a{display:flex;justify-content:space-between;align-items:center;gap:10px;text-decoration:none;background:var(--green);color:#fff;border-radius:16px;padding:14px 18px;font-weight:700}
.wa a.alt{background:var(--chip);color:var(--ink);border:1.5px solid var(--line)}
.wa a span{font-weight:400;font-size:13px;opacity:.85}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;user-select:all}
.foot{text-align:center;font-size:12px;color:var(--muted)}
.preview{font-size:12px;background:var(--chip);border-radius:10px;padding:8px 12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:420px){.hero h1{font-size:22px}.q{font-size:19px}.scale{grid-template-columns:repeat(5,1fr)}}
</style>

  function prune(){ // drop answers from other segments when segment changes
    Object.keys(Q.diagnose).forEach(function(s){ if(s!==A.segment) Q.diagnose[s].forEach(function(q){delete A[q.id]}); });
    [].concat(Q.qualify,Q.close).forEach(function(q){ if(q.seg && A[q.id]!==undefined){ var ok=(rq(q).opts||[]).map(val).indexOf(A[q.id])>-1; if(q.opts||rq(q).opts){ if(!ok && rq(q).type!=="long") delete A[q.id]; } } });
  }
  function next(){
    var f=flow(), q=f[i][1], inp=card.querySelector("input,textarea"), e=document.getElementById("err");
    if(inp) A[q.id]=inp.value.trim();
    var v=A[q.id], empty = v===undefined||v===""||(Array.isArray(v)&&!v.length);
    if(q.req&&empty){e.textContent="السؤال ده مهم عشان التشخيص يطلع دقيق.";return;}
    if(q.id==="email"&&v&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){e.textContent="الإيميل ما مكتوب صح. التقرير بيوصلك عليه.";return;}
    if(q.id==="whatsapp"&&v&&v.replace(/\D/g,"").length<9){e.textContent="الرقم ناقص. اكتب الرقم كامل عشان نقدر نتواصل معاك.";return;}
    i++; render();
  }

  // ---- scoring + constraint (Hormozi: Leads -> Conversion -> Delivery -> Retention -> Profit) ----
  function qq(id){var all=[].concat(Q.qualify,Q.close,Q.diagnose[A.segment]||[]);for(var k=0;k<all.length;k++)if(all[k].id===id)return rq(all[k]);return null;}
  function idx(id){var q=qq(id);return q&&q.opts?q.opts.map(val).indexOf(A[id]):-1;}
  function pts(id){var q=qq(id),k=idx(id);return (q&&q.sc&&k>-1)?q.sc[k]:0;}
  function score(){
    var s={freelancer:8,small:18,medium:30,classA:35}[A.segment]||0;
    s+=pts("stage");
    s+=(A.urgency||0)*2;
    s+=[15,10,5,0][idx("start")]||0;
    s+=[15,8,3,0][idx("invest")]||0;
    s+=pts("role");
    var b=idx(A.segment==="classA"?"a_budget":"m_budget"); if(b>-1&&b<4) s+=b*2;
    return Math.min(100,s);
  }
  function constraint(){
    var p=A.f_problem||A.s_problem||A.m_constraint||A.a_challenge||"";
    if(/عملاء جدد|أجيب عملاء|الحصة|ما عارف أبدأ|ما ثابت/.test(p)) return "Leads – جلب العملاء";
    if(/البيع ضعيف|تحويل|المبيعات والموزعين|السعر قليل/.test(p)) return "Conversion – تحويل الاهتمام لمبيعات";
    if(/التسليم|وقت ولا نظام|بطء التنفيذ/.test(p)) return "Delivery – التشغيل والأنظمة";
    if(/ما بيرجعوا/.test(p)) return "Retention – رجوع العملاء";
    if(/الأرباح|الهوامش|ROI/.test(p)) return "Profit – الربحية والقياس";
    if(/البراند|المحتوى|بورتفوليو/.test(p)) return "Offer & Trust – العرض والثقة";
    return "يحتاج مراجعة";
  }
  function tier(s){return s>=65?"Hot":s>=40?"Warm":"Cold";}

  function submit(){
    var s=score(), payload=Object.assign({}, A, {
      score:s, tier:tier(s), constraint:constraint(), segment_ar:SEG_AR[A.segment]||"",
      submitted_at:new Date().toISOString(), page:"diagnosis-v1"
    });
    Object.keys(payload).forEach(function(k){if(Array.isArray(payload[k]))payload[k]=payload[k].join("، ");});
    card.innerHTML='<h2 class="q">ثواني بس، بنسجّل إجاباتك...</h2>';
    var fail=function(){card.innerHTML='<h2 class="q">حصلت مشكلة في الإرسال</h2><p>جرّب تاني بعد شوية، أو راسلنا واتساب على <span class="num">0119744949</span> وقول "تشخيص".</p><button class="btn primary" id="retry">جرّب تاني</button>';document.getElementById("retry").onclick=submit;};
    fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)})
      .then(function(){thanks(payload)}).catch(fail);
  }

  function wa(text){return "https://wa.me/"+WA+"?text="+encodeURIComponent(text);}
  function thanks(p){
    document.querySelectorAll(".stage").forEach(function(el){el.classList.add("on");el.querySelector("span").style.width="100%";});
    var name=p.name||"", seg=p.segment_ar, prob=p.f_problem||p.s_problem||p.m_constraint||p.a_challenge||"", biz=p.business?(" من "+p.business):"";
    var book=BOOKLET[p.segment];
    var h='<div class="done" style="display:flex;flex-direction:column;gap:16px">';
    h+='<h2>شكراً يا '+esc(name)+'، استلمنا كل التفاصيل ✅</h2>';
    h+='<p>فريق Mind Up بيراجع إجاباتك هسي. خلال 12 إلى 24 ساعة بيوصلك في الإيميل <b class="num">'+esc(p.email||"")+'</b>:</p>';
    h+='<ul class="steps"><li><b class="n">1</b><span><b>تقرير التشخيص:</b> وين الاختناق الحقيقي في بزنسك، وليه.</span></li>';
    h+='<li><b class="n">2</b><span><b>خطة 30 يوم:</b> خطوات أسبوع بأسبوع تبدأ بيها حتى لو براك.</span></li>';
    h+='<li><b class="n">3</b><span><b>الخطوة الجاية:</b> لو حبيت نمشي معاك أبعد.</span></li></ul>';
    h+='<p>ما داير تنتظر؟ اختار من هنا والرسالة بتنكتب ليك جاهزة في واتساب:</p><div class="wa">';
    if(book) h+='<a href="'+wa("السلام عليكم، أنا "+name+biz+" ("+seg+"). عملت التشخيص المجاني، وعايز "+book+".")+'" target="_blank" rel="noopener">أبدأ بالكتيب: '+esc(book)+'<span>واتساب ←</span></a>';
    h+='<a class="'+(book?'alt':'')+'" href="'+wa("السلام عليكم، أنا "+name+biz+" ("+seg+"). مشكلتي: "+prob+". عايز أحجز جلسة التشخيص 45 دقيقة مع أ. محمد مبارك.")+'" target="_blank" rel="noopener">أحجز جلسة تشخيص 45 دقيقة<span>واتساب ←</span></a>';
    h+='<a class="alt" href="'+wa("السلام عليكم، أنا "+name+biz+" ("+seg+"). عملت التشخيص و"+(p.segment==="classA"?"عايزين عرض مبدئي من Mind Up لشركتنا":p.segment==="freelancer"?"عايز أعرف برنامج Mind Up للفريلانسرز":"عايز أعرف باقات Mind Up المناسبة لي")+". التحدي الأساسي: "+prob+".")+'" target="_blank" rel="noopener">'+(p.segment==="classA"?"أطلب عرض مبدئي لشركتنا":p.segment==="freelancer"?"عايز برنامج فيه متابعة":"عايز فريق Mind Up ينفذ معاي")+'<span>واتساب ←</span></a>';
    h+='</div><p class="hint">لو الزر ما فتح واتساب، راسلنا على <span class="num">0119744949</span> (من خارج السودان: <span class="num">+249 119 744 949</span>).</p></div>';
    card.innerHTML=h;
  }
  render();
})();
</script>
