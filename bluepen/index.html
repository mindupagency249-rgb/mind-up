/* v4: Blue Pen brand (El Messiri + IBM Plex Sans Arabic, midnight navy + gold) · premium dark · frosted glass · depth layers ("4D") */
:root{
  --bg:#0A0F1A; --bg2:#101828; --navy:#16233F; --ivory:#F4EFE6; --ivory2:rgba(244,239,230,.72); --muted:rgba(244,239,230,.5);
  --gold:#D9B66C; --gold2:#E9D6BF; --cognac:#8A5A3B; --wa:#3BD27A;
  --glass:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.04) 60%,rgba(255,255,255,.07));
  --gline:rgba(255,255,255,.22); --line:rgba(244,239,230,.12);
  --disp:'Messiri','Plex',serif; --body:'Plex',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ivory);font-family:var(--body);font-size:16px;line-height:1.6}
body{min-height:100dvh;overflow-x:hidden;background:radial-gradient(120% 60% at 50% -10%,#1A2A4A 0,rgba(10,15,26,0) 60%),var(--bg)}
button,input{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
.lat{direction:ltr;unicode-bidi:isolate}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--gline);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.05),0 24px 60px rgba(0,0,0,.35)}
.btn{border:0;border-radius:99px;padding:15px 26px;font-size:16px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#E8CC8A,var(--gold) 55%,#B8914A);color:#14100A;display:inline-flex;align-items:center;gap:10px;transition:transform .2s,box-shadow .2s;box-shadow:0 10px 30px rgba(217,182,108,.28),inset 0 1px 0 rgba(255,255,255,.5)}
.btn:active{transform:scale(.97)}
.btn .dot{width:26px;height:26px;border-radius:50%;background:#14100A;color:var(--gold);display:grid;place-items:center;font-size:13px}
.btn.light{background:var(--ivory);color:var(--bg);box-shadow:none}
.btn.light .dot{background:var(--bg);color:var(--ivory)}
/* nav */
.nav{display:flex;align-items:center;justify-content:space-between;padding-top:calc(env(safe-area-inset-top,0px) + 16px);position:relative;z-index:8}
.logo{display:flex;align-items:center;gap:9px}
.logo img{width:34px;height:34px;border-radius:50%;background:var(--ivory);padding:2px}
.logo b{font-family:var(--disp);font-weight:700;letter-spacing:2px;font-size:17px}
.logo small{display:block;font-size:8px;letter-spacing:3px;color:var(--gold);margin-top:-5px}
.links{display:none;gap:28px;font-size:13px;color:var(--ivory2)}
.round{width:42px;height:42px;border-radius:50%;color:var(--ivory);display:grid;place-items:center;cursor:pointer;font-size:16px}
/* hero stage */
.stage{position:relative;height:min(94dvh,860px);min-height:640px;perspective:1000px;overflow:hidden;margin-top:-64px;padding-top:64px}
.layer{position:absolute;inset:0;will-change:transform;transition:transform .25s cubic-bezier(.2,.7,.2,1)}
.photo{inset:-4%}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block;filter:brightness(.78) saturate(1.05)}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,15,26,.55) 0,rgba(10,15,26,0) 22%,rgba(10,15,26,0) 50%,rgba(10,15,26,.85) 82%,var(--bg) 100%),radial-gradient(90% 70% at 50% 40%,rgba(10,15,26,0) 40%,rgba(10,15,26,.7) 100%)}
.bigbg{display:flex;align-items:flex-start;justify-content:center;padding-top:16%;font-family:var(--disp);font-weight:700;font-size:clamp(90px,26vw,340px);line-height:.8;color:transparent;-webkit-text-stroke:1px rgba(233,214,191,.16);letter-spacing:2px;white-space:nowrap}
.rim{position:absolute;left:50%;top:62%;width:min(120vw,900px);height:320px;transform:translate(-50%,-50%);background:radial-gradient(50% 50% at 50% 50%,rgba(217,182,108,.22),rgba(217,182,108,0) 70%);filter:blur(10px)}
/* the floating glass card (ref: frosted card held in front of a person) */
.float{display:flex;align-items:flex-end;justify-content:center;padding-bottom:max(9%,64px);pointer-events:none}
.gcard{pointer-events:auto;width:min(100%,470px);border-radius:28px;padding:20px 22px 22px;position:relative;overflow:hidden;transform-style:preserve-3d;
  background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05) 55%,rgba(255,255,255,.09));
  -webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border:1px solid rgba(255,255,255,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1px rgba(255,255,255,.04),0 0 0 1px rgba(150,210,255,.06),0 0 28px rgba(150,210,255,.16),0 40px 90px rgba(0,0,0,.55)}
.gcard::before{content:"";position:absolute;inset:-40%;background:linear-gradient(105deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.16) 50%,rgba(255,255,255,0) 60%);transform:translateX(calc(var(--sx,0) * 30%));pointer-events:none}
.gcard::after{content:"";position:absolute;left:12%;right:12%;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(160,220,255,.9),transparent);filter:blur(.5px)}
.gtop{display:flex;align-items:center;gap:10px;position:relative}
.gtop img{width:44px;height:44px;border-radius:50%;background:var(--ivory);padding:2px;box-shadow:0 0 0 2px rgba(217,182,108,.55)}
.gtop .who b{font-family:var(--disp);font-size:17px;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.gtop .who b i{width:15px;height:15px;border-radius:50%;background:var(--gold);color:#14100A;font-size:10px;font-style:normal;display:grid;place-items:center}
.gtop .who small{display:block;font-size:11.5px;color:var(--ivory2);margin-top:-3px}
.gtop .live{margin-inline-start:auto;font-size:11px;color:var(--gold);border:1px solid rgba(217,182,108,.4);border-radius:99px;padding:3px 10px;background:rgba(217,182,108,.08)}
.gcard h1{font-family:var(--disp);font-weight:700;font-size:clamp(40px,11vw,60px);line-height:1.05;margin:14px 0 4px;position:relative;letter-spacing:0}
.gcard h1 em{font-style:normal;background:linear-gradient(135deg,#F4E3BE,var(--gold) 50%,#B8914A);-webkit-background-clip:text;background-clip:text;color:transparent}
.gcard .sub{margin:0 0 14px;color:var(--ivory2);font-size:14.5px;position:relative}
.gstats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(255,255,255,.14);border-bottom:1px solid rgba(255,255,255,.14);padding:10px 0;margin-bottom:12px;position:relative}
.gstats div{text-align:center;font-size:11.5px;color:var(--ivory2)}
.gstats b{display:block;font-family:var(--disp);font-size:26px;line-height:1.2;color:var(--ivory)}
.glines{display:grid;gap:4px;font-size:13px;color:var(--ivory2);margin-bottom:16px;position:relative}
.glines span{display:flex;gap:8px;align-items:center}
.glines i{font-style:normal;width:18px;text-align:center;color:var(--gold)}
.gcard .btn{width:100%;justify-content:center;position:relative}
.scroll{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font-size:10.5px;letter-spacing:3px;color:var(--muted);z-index:3}
/* sections */
.sec{padding-top:80px;padding-bottom:20px;position:relative}
.kick{font-size:12px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;display:flex;gap:10px;align-items:center}
.kick::before{content:"";width:22px;height:1px;background:currentColor}
.h2{font-family:var(--disp);font-weight:700;font-size:clamp(34px,8vw,60px);line-height:1.15;margin:10px 0 26px}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 0 24px;margin-left:calc(-1*max(20px,env(safe-area-inset-left,0px)));padding-left:max(20px,env(safe-area-inset-left,0px));scrollbar-width:none;perspective:900px}
.rail::-webkit-scrollbar{display:none}
.look{flex:0 0 min(72vw,290px);scroll-snap-align:start;border-radius:24px;overflow:hidden;position:relative;cursor:pointer;transform-style:preserve-3d;transition:transform .3s;border:0;padding:0;text-align:right;color:var(--ivory);background:#111a2b}
.look .ph{aspect-ratio:3/4;background:var(--bg2) center 20%/cover no-repeat;position:relative}
.look .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,15,26,0) 45%,rgba(10,15,26,.92))}
.look .num{position:absolute;top:14px;left:16px;font-family:var(--disp);font-size:22px;color:var(--gold);z-index:2}
.look .cap{position:absolute;left:10px;right:10px;bottom:10px;border-radius:18px;padding:12px 14px;z-index:2}
.look .cap b{font-family:var(--disp);font-weight:700;font-size:19px;display:block}
.look .cap small{color:var(--ivory2);font-size:12.5px}
.steps{display:grid;gap:12px}
.steps div{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:18px;border-radius:22px;align-items:center}
.steps b{font-family:var(--disp);font-weight:700;font-size:34px;line-height:1;color:var(--gold)}
.steps span{font-size:17px;font-weight:700}
.steps small{display:block;color:var(--ivory2);font-weight:400;font-size:13.5px}
.band{border-radius:30px;margin-top:60px;padding:36px 24px;position:relative;overflow:hidden;background:radial-gradient(120% 120% at 100% 0,rgba(217,182,108,.25),rgba(217,182,108,0) 50%),linear-gradient(135deg,#16233F,#0E1626)}
.band .big{font-family:var(--disp);font-weight:700;font-size:clamp(70px,20vw,170px);line-height:.85;color:transparent;-webkit-text-stroke:1px rgba(233,214,191,.16);position:absolute;left:-10px;bottom:-14px;white-space:nowrap}
.band h3{font-family:var(--disp);font-weight:700;font-size:32px;margin:0 0 4px;position:relative}
.band p{color:var(--ivory2);margin:0 0 22px;position:relative}
.band .btn{position:relative}
.foot{padding-top:40px;padding-bottom:50px;color:var(--muted);font-size:12.5px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
/* quiz */
.qtop{position:sticky;top:0;z-index:6;background:linear-gradient(180deg,var(--bg) 70%,rgba(10,15,26,0));padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:16px}
.qtop .r{display:flex;justify-content:space-between;align-items:center}
.count{font-family:var(--disp);font-size:24px;font-weight:700}
.count small{color:var(--muted);font-size:14px}
.bar2{height:3px;background:var(--line);margin-top:14px;border-radius:3px;overflow:hidden}
.bar2 i{display:block;height:100%;background:linear-gradient(90deg,#B8914A,var(--gold),#F4E3BE);width:0;transition:width .5s cubic-bezier(.2,.7,.2,1);box-shadow:0 0 12px rgba(217,182,108,.6)}
.qb{padding-top:18px;padding-bottom:150px;max-width:640px;margin:0 auto;perspective:900px}
.qin{animation:qin .5s cubic-bezier(.2,.7,.2,1)}
@keyframes qin{from{opacity:0;transform:translateZ(-120px) rotateX(8deg) translateY(30px)}to{opacity:1;transform:none}}
.stg{font-size:12px;letter-spacing:2px;color:var(--gold);font-weight:700}
.q{font-family:var(--disp);font-weight:700;font-size:clamp(30px,7.6vw,44px);line-height:1.25;margin:6px 0 8px}
.hint{color:var(--ivory2);font-size:15px;margin:0 0 22px}
.opts{display:grid;gap:10px}
.opts.g2{grid-template-columns:1fr 1fr}
.opts.g3{grid-template-columns:repeat(3,1fr)}
.opt{background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:16px;text-align:right;font-size:16px;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:58px;transition:transform .15s,background .15s,border-color .15s;box-shadow:inset 0 1px 0 rgba(255,255,255,.12);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.opt:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.3)}
.opt small{display:block;font-size:12.5px;color:var(--ivory2)}
.opt.c{justify-content:center;text-align:center;font-weight:700;padding:14px 6px}
.opt.c.l{font-family:var(--disp);font-size:19px;direction:ltr}
.opt .chk{margin-inline-start:auto;width:20px;height:20px;border-radius:50%;border:1px solid rgba(255,255,255,.3);flex:none}
.opt.sel{background:linear-gradient(135deg,rgba(217,182,108,.28),rgba(217,182,108,.1));border-color:var(--gold);box-shadow:0 0 0 1px rgba(217,182,108,.35),0 10px 30px rgba(217,182,108,.15),inset 0 1px 0 rgba(255,255,255,.2)}
.opt.sel .chk{border-color:var(--gold);background:radial-gradient(circle,var(--gold) 42%,transparent 47%)}
.sw{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);flex:none}
.field{display:grid;gap:6px}
.field label{font-size:13px;color:var(--ivory2)}
input.t{width:100%;font-size:19px;padding:17px 18px;border-radius:18px;border:1px solid rgba(255,255,255,.16);background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.03));outline:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
input.t::placeholder{color:rgba(244,239,230,.35)}
input.t:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,182,108,.18)}
input.t[dir=ltr]{text-align:left}
.err{color:#FF9C84;font-size:13.5px;min-height:22px;margin-top:6px}
.skip{background:none;border:0;color:var(--ivory2);text-decoration:underline;font-size:14px;cursor:pointer;padding:8px 0}
.fbar{position:fixed;bottom:0;left:0;right:0;z-index:7;background:linear-gradient(180deg,rgba(10,15,26,0),var(--bg) 40%);padding-top:24px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}

.rcard .gsize div{text-align:center;font-size:11.5px;color:var(--ivory2)}
.rcard .gsize b{display:block;font-family:var(--disp);font-size:24px;color:var(--ivory)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px;position:relative}
.chips span{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:4px 11px 4px 5px;font-size:12px}
.chips .sw{width:17px;height:17px}
.ai{font-size:10.5px;color:var(--muted);margin-top:10px;text-align:center;position:relative}
.cards{display:grid;gap:14px}
.card{border-radius:24px;padding:22px}
.card h3{font-family:var(--disp);font-weight:700;font-size:23px;margin:0 0 12px;display:flex;gap:12px;align-items:baseline}
.card h3 b{font-family:var(--disp);color:var(--gold);font-size:20px}
.tips{list-style:none;margin:0;padding:0}
.tips li{padding:12px 0;border-top:1px solid var(--line);font-size:15.5px;color:var(--ivory)}
.tips li:first-child{border-top:0;padding-top:0}
.it{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.it .nm{flex:1;min-width:0;font-weight:700}
.it .nm small{display:block;color:var(--ivory2);font-weight:400;font-size:13px}
.step{display:flex;align-items:center;gap:4px}
.step button{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);font-size:18px;cursor:pointer}
.step output{min-width:28px;text-align:center;font-family:var(--disp);font-size:20px;font-weight:700}
.note{font-size:13.5px;color:var(--ivory2);margin:12px 0 0}
.br{display:grid;gap:12px}
.bc{border-radius:24px;padding:22px;position:relative;overflow:hidden;transform-style:preserve-3d;transition:transform .3s}
.bc.n1{background:radial-gradient(120% 120% at 0 0,rgba(217,182,108,.22),rgba(217,182,108,0) 55%),var(--glass);border-color:rgba(217,182,108,.5)}
.bc .bg{position:absolute;left:-6px;bottom:-18px;font-family:var(--disp);font-weight:700;font-size:80px;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(233,214,191,.12);white-space:nowrap;direction:ltr}
.bc .near{position:absolute;top:18px;left:18px;background:var(--gold);color:#14100A;font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 10px}
.bc h4{font-family:var(--disp);font-weight:700;font-size:25px;margin:0;position:relative}
.bc p{margin:2px 0 16px;color:var(--ivory2);font-size:13.5px;position:relative}
.bc .acts{display:flex;gap:8px;position:relative}
.bc a{flex:1;text-align:center;text-decoration:none;border-radius:99px;padding:13px 10px;font-weight:700;font-size:14.5px;background:var(--ivory);color:var(--bg)}
.bc.n1 a.w{background:linear-gradient(135deg,#E8CC8A,var(--gold) 55%,#B8914A);color:#14100A}
.bc a.c{flex:0 0 auto;background:transparent;border:1px solid rgba(255,255,255,.25);color:var(--ivory);padding:13px 16px;direction:ltr}
.saved{color:var(--wa);font-size:13px;text-align:center;min-height:20px;margin-top:10px}
@media (min-width:900px){
  .links{display:flex}
  .stage{height:min(92vh,900px)}
  .float{padding-bottom:6%}
  .photo{left:calc(50% - min(380px,32vw));right:auto;width:min(760px,64vw);-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
  .photo img{object-position:50% 12%}
  .gcard{width:520px}
  .cards{grid-template-columns:1fr 1fr}
  .br{grid-template-columns:repeat(3,1fr)}
  .steps{grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion:reduce){.layer{transition:none!important}.qin{animation:none}}

/* ===== depth engine: pointer + device tilt + scroll ===== */
let depthOff=null;
function depth(stage){
  if(depthOff)depthOff(); if(!stage)return;
  const L=[...stage.querySelectorAll('[data-d]')]; let tx=0,ty=0,cx=0,cy=0,sy=0,raf,t0=performance.now(),user=false;
  const mv=e=>{const r=stage.getBoundingClientRect();tx=((e.clientX-r.left)/r.width-.5)*2;ty=((e.clientY-r.top)/r.height-.5)*2;user=true};
  const ori=e=>{if(e.gamma==null)return;tx=Math.max(-1,Math.min(1,e.gamma/25));ty=Math.max(-1,Math.min(1,(e.beta-45)/25));user=true};
  const sc=()=>{sy=scrollY};
  addEventListener('pointermove',mv);addEventListener('deviceorientation',ori);addEventListener('scroll',sc,{passive:true});
  const red=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const loop=t=>{ if(!user){const k=(t-t0)/1000;tx=Math.sin(k*.6)*.35;ty=Math.cos(k*.45)*.25}
    cx+=(tx-cx)*.07;cy+=(ty-cy)*.07;
    L.forEach(el=>{const d=+el.dataset.d;const s=red?0:1;
      const r=+(el.dataset.r||1);el.style.transform=`translate3d(${(-cx*d*9*s).toFixed(2)}px,${(-cy*d*8*s+sy*d*.18).toFixed(2)}px,${d*12}px) rotateY(${(cx*1.2*r*s).toFixed(2)}deg) rotateX(${(-cy*1.6*r*s).toFixed(2)}deg) scale(${1+Math.min(sy,600)/6000*d})`;el.style.setProperty('--sx',cx.toFixed(3))});
    raf=requestAnimationFrame(loop)};
  raf=requestAnimationFrame(loop);
  depthOff=()=>{cancelAnimationFrame(raf);removeEventListener('pointermove',mv);removeEventListener('deviceorientation',ori);removeEventListener('scroll',sc);depthOff=null};
}
function tiltCards(sel){document.querySelectorAll(sel).forEach(c=>{c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`rotateY(${x*10}deg) rotateX(${-y*10}deg) translateZ(10px)`});c.addEventListener('pointerleave',()=>c.style.transform='')})}

/* ===== landing ===== */
function landing(){
  $('#fbar').hidden=true;
  app.innerHTML=nav()+`<section class="stage" id="stage">
     <div class="layer photo" data-d="-.5"><img src="${IMG.hero}" alt="موديل بطقم Blue.pen"></div>
     <div class="layer bigbg lat" data-d="-.2">BLUE.PEN</div>
     <div class="layer" data-d=".2"><div class="rim"></div></div>
     <div class="layer float gut" data-d="1.6" data-r="5">
       <div class="gcard">
         <div class="gtop"><img src="${LOGO}" alt=""><div class="who lat"><b>blue.pen <i>✓</i></b><small>Blue.pen · Est. 2020</small></div><span class="live">مجاناً</span></div>
         <h1>طقم <em>الحضور</em></h1>
         <p class="sub">قول لينا مناسبتك، ونجهّز ليك خطة إطلالتك كاملة في دقيقتين.</p>
         <div class="gstats"><div><b class="lat">3</b>فروع</div><div><b class="lat">7</b>مناسبات</div><div><b class="lat">2</b>دقيقة</div></div>
         <div class="glines"><span><i>◆</i>الخرطوم · أمدرمان · بورتسودان</span><span><i>◆</i>تنسيق شخصي من فريق Blue.pen</span></div>
         <button class="btn go">صمّم طقمك<span class="dot">←</span></button>
       </div></div>
     <div class="scroll lat">SCROLL</div>
   </section>
   <section class="sec wrap gut"><div class="kick">المناسبات</div><h2 class="h2">لكل مناسبة<br>طقمها</h2>
     <div class="rail">${Object.entries(OCC).map(([k,o],n)=>`<button class="look go" data-occ="${k}"><div class="ph" style="background-image:url('${IMG[k]||IMG.hero}')"><span class="num lat">0${n+1}</span></div><div class="cap glass"><b>${o.look.join(' ')}</b><small>${o.top} · ${o.bottom}</small></div></button>`).join('')}</div></section>
   <section class="sec wrap gut"><div class="kick">كيف بتشتغل</div><h2 class="h2">تلاتة خطوات<br>وطقمك جاهز</h2>
     <div class="steps"><div class="glass"><b class="lat">01</b><span>قول لينا مناسبتك وذوقك<small>اجتماع، عرس، مقابلة، دوام، سفر أو طلعة</small></span></div>
       <div class="glass"><b class="lat">02</b><span>شوف طقمك كامل بألوانك<small>مع ٣ نصايح تنسيق ومقاساتك في مكان واحد</small></span></div>
       <div class="glass"><b class="lat">03</b><span>اختار فرعك وكلّمهم مباشرة<small>الخرطوم، أمدرمان أو بورتسودان</small></span></div></div>
     <div class="band"><div class="big lat">BLUE.PEN</div><h3>اختصار الذوق</h3><p>مجاني تماماً، وما في أي التزام بالشراء.</p><button class="btn go">ابدأ هسي<span class="dot">←</span></button></div></section>
   <footer class="foot wrap gut"><span>Blue.pen · وجودة بتتكلم عن نفسها</span><span class="lat">© 2026 BLUE.PEN</span></footer>`;
  app.querySelectorAll('.go').forEach(b=>b.onclick=()=>{if(b.dataset.occ)A.occ=b.dataset.occ;i=0;render();scrollTo(0,0)});
  depth($('#stage')); tiltCards('.look');
}
/* ===== quiz ===== */
function render(){
  if(i<0)return landing(); if(i>=Q.length)return result();
  depth(null); const q=Q[i]; $('#fbar').hidden=false; const v=k=>(A[k]||'').replace(/"/g,'&quot;');
  let h=nav()+`<div class="qtop wrap gut"><div class="r"><span class="count lat">${String(i+1).padStart(2,'0')}<small> / ${Q.length}</small></span><span class="stg">${q.s}</span></div><div class="bar2"><i style="width:${i/Q.length*100}%"></i></div></div>
  <div class="qb gut"><div class="qin"><h2 class="q">${q.q}</h2>${q.h?`<p class="hint">${q.h}</p>`:''}`;
  if(q.type==='text')h+=`<input class="t" id="inp" autocomplete="name" placeholder="${q.ph}" value="${v('name')}">`;
  if(q.type==='phone')h+=`<input class="t" id="inp" type="tel" inputmode="tel" dir="ltr" autocomplete="tel" placeholder="${q.ph}" value="${v('phone_raw')}">`;
  if(q.type==='email')h+=`<input class="t" id="inp" type="email" inputmode="email" dir="ltr" autocomplete="email" placeholder="${q.ph}" value="${v('email')}"><button class="skip" id="skip">ما عندي إيميل</button>`;
  if(q.type==='home')h+=`<div class="opts g3" style="margin-bottom:16px">${CITY.map(([k,l])=>`<button class="opt c ${A.city===k?'sel':''}" data-k="${k}">${l}</button>`).join('')}</div><div class="field"><label for="inp">الحي أو المنطقة</label><input class="t" id="inp" autocomplete="address-level3" placeholder="مثلاً: الرياض، الثورة، حي المطار" value="${v('area')}"></div>`;
  if(q.type==='one'||q.type==='multi')h+=`<div class="opts ${q.g||''}">`+q.opts.map(([k,l,sub,sw])=>{const sel=q.type==='multi'?(A[q.id]||[]).includes(k):A[q.id]===k;const short=q.g==='g3'&&!sw;const lat=short&&!/[ء-ي]/.test(l);
    return `<button class="opt ${short?'c':''} ${lat?'l':''} ${sel?'sel':''}" data-k="${k}">${sw?`<span class="sw" style="background:${sw}"></span>`:''}<span>${l}${sub?`<small>${sub}</small>`:''}</span>${!short&&!sw?'<span class="chk"></span>':''}</button>`}).join('')+'</div>';
  app.innerHTML=h+`<div class="err" id="err"></div></div></div>`;
  app.querySelector('.go').onclick=()=>{i=-1;render()};
  const nb=$('#next');nb.style.display='';nb.textContent='التالي';
  if(q.type==='one'){nb.style.display='none';app.querySelectorAll('.opts .opt').forEach(b=>b.onclick=()=>{A[q.id]=b.dataset.k;app.querySelectorAll('.opts .opt').forEach(x=>x.classList.toggle('sel',x===b));setTimeout(()=>{i++;render()},220)})}
  if(q.type==='home')app.querySelectorAll('.opts .opt').forEach(b=>b.onclick=()=>{A.city=b.dataset.k;app.querySelectorAll('.opts .opt').forEach(x=>x.classList.toggle('sel',x===b));$('#err').textContent=''});
  if(q.type==='multi'){A.colors=A.colors||[];const up=()=>nb.textContent=A.colors.length?'التالي':'اختاروا ليا انتو';up();
    app.querySelectorAll('.opts .opt').forEach(b=>b.onclick=()=>{const a=A.colors,k=b.dataset.k,x=a.indexOf(k);if(x>-1)a.splice(x,1);else{if(a.length>=3){$('#err').textContent='اخترت ٣ ألوان. شيل واحد عشان تختار غيرو.';return}a.push(k)}$('#err').textContent='';b.classList.toggle('sel');up()})}
  const inp=$('#inp');if(inp){if(q.type!=='home')setTimeout(()=>inp.focus(),80);inp.onkeydown=e=>{if(e.key==='Enter')nb.click()}}
  const sk=$('#skip');if(sk)sk.onclick=()=>{A.email='';i++;render()};
}
$('#next').onclick=()=>{const q=Q[i],v=($('#inp')||{}).value?.trim()||'',E=t=>$('#err').textContent=t;
  if(q.type==='text'){if(v.length<2)return E('اكتب اسمك لو سمحت.');A.name=v}
  if(q.type==='phone'){const p=normPhone(v);if(!p)return E('الرقم ما مظبوط. اكتبو زي كدا: 0912345678');A.phone=p;A.phone_raw=v}
  if(q.type==='email'){if(v&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v))return E('الإيميل ما مظبوط. اتأكد منو أو اضغط «ما عندي إيميل».');A.email=v}
  if(q.type==='home'){if(!A.city)return E('اختار مدينتك.');A.area=v}
  i++; if(i===5&&A.occ)i=6; render();scrollTo(0,0)};
$('#back').onclick=()=>{i--;render();scrollTo(0,0)};
/* ===== logic ===== */
function buildLook(){const o=OCC[A.occ],pref=A.colors||[],lights=pref.filter(k=>COLORS[k].light),darks=pref.filter(k=>!COLORS[k].light);let s,t;
  if(o.casual){s=pref[0]||o.defS;t=pref.find(k=>k!==s&&!COLORS[k].light)||o.defT;if(t===s)t=s==='navy'?'black':'navy'}
  else{s=lights[0]||(darks.length&&!lights.length?darks[0]:o.defS);t=darks.find(k=>k!==s)||(COLORS[s].light?o.defT:(s==='camel'?'navy':'camel'));if(t===s)t='navy'}
  let shoe,shoeN;if(o.casual){shoe='#F2F0EC';shoeN='أبيض'}else if(['black','grey','burgundy'].includes(t)){shoe='#151313';shoeN='أسود'}else{shoe='#5E3A22';shoeN='بني'}
  return{s,t,shoe,shoeN,o}}
function pieces(L){const o=L.o,l=[],m=A.occ==='work'?[3,2]:[1,1],sz=v=>v==='?'?'نحدده معاك':v;
  l.push({k:'top',n:o.top,sub:`${COLORS[L.s].n} · مقاس ${sz(A.shirt)}`,q:m[0]});l.push({k:'bottom',n:o.bottom,sub:`${COLORS[L.t].n} · وسط ${sz(A.waist)}`,q:m[1]});
  if(A.shoe!=='no')l.push({k:'shoe',n:o.shoe,sub:`${L.shoeN} · مقاس ${sz(A.shoe)}`,q:1});
  if(!o.casual)l.push({k:'belt',n:'حزام جلد (قاش)',sub:`بلون الجزمة: ${L.shoeN}`,q:A.shoe==='no'?0:1});
  l.push({k:'socks',n:'شرابات',sub:o.formal?'غامقة وطويلة مع الجلد':'قصيرة مع السنيكرز',q:o.formal?1:0});
  l.push({k:'under',n:'ملابس قطنيل الداخلية',sub:'الأساس البتحسّو طول اليوم',q:0});
  if(o.casual)l.push({k:'layer',n:'هودي أو جاكيت خفيف',sub:'للمسا والمكيفات',q:0});return l}
function tips(L){const t=[L.o.tip,STYLE_TIP[A.style],L.o.casual?'السنيكرز الأبيض بيمشي مع أي جينز. خليه نضيف دايماً.':`القاعدة الذهبية: الحزام بنفس لون الجزمة (${L.shoeN})، والشراب أغمق من البنطلون.`];
  if(A.shirt==='4XL+')t[1]='المقاسات الكبيرة: القصّة الصاح أهم من اللون. قميص بكتف مظبوط وطول بيغطي الحزام.';return t}
function score(){const tl={week:40,'2w':30,month:20,look:5}[A.when]||0;let rd=0;['shirt','waist','shoe'].forEach(k=>{if(A[k]&&A[k]!=='?')rd+=8});if(A.cust!=='new')rd+=10;if(A.city&&A.city!=='ab')rd+=6;
  const dq=(A.phone?10:0)+(A.email?6:0)+((A.name||'').trim().split(/\s+/).length>1?4:2);const tot=tl+rd+dq;return{tot,letter:tot>=75?'A':tot>=45?'B':'C',tier:tot>=75?'ساخن 🔥':tot>=45?'دافي':'بارد'}}
const nearest=()=>({kh:'kh',bh:'kh',om:'om',ps:'ps'}[A.city]||null);
const lbl=id=>{const q=Q.find(x=>x.id===id);const o=q&&q.opts&&q.opts.find(x=>x[0]===A[id]);return o?o[1]:''};
function waText(L,list,b){const sc=score(),o=L.o,city=(CITY.find(c=>c[0]===A.city)||[])[1]||'';const items=list.filter(x=>qty[x.k]>0).map(x=>`• ${x.n} ×${qty[x.k]}`).join('\n')||'• نحدد القطع مع بعض';
  return `السلام عليكم ${b.name} 💙
دي خطة «طقم الحضور» بتاعتي:

👤 ${A.name}
📱 +${A.phone}${A.email?`\n✉️ ${A.email}`:''}
🏠 ${city}${A.area?' – '+A.area:''}
🎯 ${o.l} (${lbl('when')})
👔 ${lbl('style')}
🎨 ${o.top} ${COLORS[L.s].n} + ${o.bottom} ${COLORS[L.t].n}${A.shoe==='no'?'':' + '+o.shoe+' '+L.shoeN}
📏 قميص ${lbl('shirt')} · بنطلون ${lbl('waist')} · جزمة ${lbl('shoe')}
🛍️ القطع:
${items}
🧾 ${lbl('cust')} · عرفتكم من: ${lbl('heard')}

#${KEYWORD} · ${sc.letter} ${sc.tier}`}
async function saveLead(L,list){if(!LEAD_ENDPOINT||!LEAD_KEY.startsWith('ey'))return false;const sc=score();
  const row={name:A.name,phone:A.phone,email:A.email||null,city:A.city,area:A.area||null,heard:A.heard,occasion:A.occ,timeline:A.when,style:A.style,customer:A.cust,colors:(A.colors||[]).join(','),shirt:A.shirt,waist:A.waist,shoe:A.shoe,look:`${COLORS[L.s].n}/${COLORS[L.t].n}/${L.shoeN}`,items:Object.fromEntries(list.map(x=>[x.k,qty[x.k]])),score:sc.tot,tier:sc.letter,source:(location.hostname||'file').slice(0,100)};
  try{const r=await fetch(LEAD_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json',apikey:LEAD_KEY,Authorization:'Bearer '+LEAD_KEY,Prefer:'return=minimal'},body:JSON.stringify(row)});return r.ok}catch(e){return false}}
/* ===== result ===== */
function result(){
  $('#fbar').hidden=true;const L=buildLook(),list=pieces(L),first=(A.name||'').split(/\s+/)[0],near=nearest();list.forEach(x=>{if(!(x.k in qty))qty[x.k]=x.q});
  const order=[...BRANCHES].sort((a,b)=>(b.id===near)-(a.id===near)),has=Object.keys(PRICES).length>0,sh=v=>['?','no'].includes(v)?'—':v.replace('4XL+','4XL');
  app.innerHTML=nav()+`<section class="stage rstage" id="stage">
     <div class="layer photo" data-d="-.5"><img src="${IMG[A.occ]||IMG.hero}" alt="${L.o.look.join(' ')}"></div>
     <div class="layer bigbg lat" data-d="-.2">${({meet:'MEETING',wed:'WEDDING',job:'INTERVIEW',work:'OFFICE',fri:'FRIDAY',trav:'TRAVEL',uni:'WEEKEND'}[A.occ]||'BLUE.PEN')}</div>
     <div class="layer" data-d=".2"><div class="rim"></div></div>
     <div class="layer float gut" data-d="1.6" data-r="5">
       <div class="gcard rcard">
         <div class="gtop"><img src="${LOGO}" alt=""><div class="who"><b>خطة ${first} <i>✓</i></b><small>${L.o.l}</small></div><span class="live">جاهزة</span></div>
         <h1>${L.o.look[0]} <em>${L.o.look[1]}</em></h1>
         <div class="chips"><span><i class="sw" style="background:${COLORS[L.s].c}"></i>${L.o.top} ${COLORS[L.s].n}</span><span><i class="sw" style="background:${COLORS[L.t].c}"></i>${L.o.bottom} ${COLORS[L.t].n}</span>${A.shoe!=='no'?`<span><i class="sw" style="background:${L.shoe}"></i>${L.o.shoe} ${L.shoeN}</span>`:''}</div>
         <div class="gsize"><div><b class="lat">${sh(A.shirt)}</b>قميص</div><div><b class="lat">${sh(A.waist)}</b>بنطلون</div><div><b class="lat">${sh(A.shoe)}</b>جزمة</div></div>
         <div class="ai">الصورة توضيحية للستايل</div>
       </div></div>
   </section>
   <section class="sec wrap gut" style="padding-top:30px"><div class="cards">
     <div class="card glass"><h3><b class="lat">01</b>نصايح ليك انت</h3><ul class="tips">${tips(L).map(t=>`<li>${t}</li>`).join('')}</ul></div>
     <div class="card glass"><h3><b class="lat">02</b>القطع المقترحة</h3>${list.map(x=>`<div class="it"><div class="nm">${x.n}<small>${x.sub}</small></div><div class="step"><button data-k="${x.k}" data-d="1" aria-label="زيادة">+</button><output id="q_${x.k}" class="lat">${qty[x.k]}</output><button data-k="${x.k}" data-d="-1" aria-label="نقصان">−</button></div></div>`).join('')}
       <p class="note" id="pricebox">${has?'':'عرض السعر بيجيك من فريق Blue.pen في الواتساب، على حسب القطع والموديلات المتوفرة.'}</p></div></div></section>
   <section class="sec wrap gut" style="padding-top:50px"><div class="kick">تواصل مع فرعك</div><h2 class="h2">اختار فرعك<br>وطقمك بيكون جاهز</h2>
     <div class="br">${order.map((b,n)=>`<div class="bc glass ${b.id===near?'n1':''}"><div class="bg">${b.k}</div>${b.id===near?'<span class="near">الأقرب ليك</span>':''}<h4>${b.name}</h4><p>${b.addr}</p><div class="acts"><a class="w" data-b="${b.id}" target="_blank" rel="noopener">راسلهم في واتساب</a><a class="c" href="tel:+${b.wa}">0${b.wa.slice(3)}</a></div></div>`).join('')}</div>
     <div class="saved" id="saved"></div></section>
   <footer class="foot wrap gut"><button class="skip" id="redo">صمّم طقم تاني</button><span class="lat">© 2026 BLUE.PEN</span></footer>`;
  app.querySelector('.go').onclick=()=>{i=-1;render()};
  const upd=()=>{app.querySelectorAll('a.w').forEach(a=>{const b=BRANCHES.find(x=>x.id===a.dataset.b);a.href='https://wa.me/'+b.wa+'?text='+encodeURIComponent(waText(L,list,b))});
    if(has){let s=0;list.forEach(x=>s+=(PRICES[x.k]||0)*qty[x.k]);$('#pricebox').textContent=s?`تقدير مبدئي: ${s.toLocaleString('ar-SD')} جنيه (السعر النهائي من الفرع)`:'عرض السعر بيجيك من فريق Blue.pen في الواتساب.'}};
  app.querySelectorAll('.step button').forEach(bt=>bt.onclick=()=>{const k=bt.dataset.k;qty[k]=Math.max(0,Math.min(9,qty[k]+ +bt.dataset.d));$('#q_'+k).textContent=qty[k];upd()});
  $('#redo').onclick=()=>{for(const k in A)delete A[k];qty={};i=-1;render();scrollTo(0,0)};
  upd();scrollTo(0,0);depth($('#stage'));tiltCards('.bc');
  window.__lead={A,score:score(),text:waText(L,list,order[0])};
  saveLead(L,list).then(ok=>{window.__saved=ok;if(ok)$('#saved').textContent='✓ حفظنا خطتك، وفريقنا ممكن يتواصل معاك.'});
}
render();
</script>
