/* v4: Blue Pen brand (El Messiri + IBM Plex Sans Arabic, midnight navy + gold) · premium dark · frosted glass · depth layers ("4D") */
:root{
  --bg:#0A0F1A; --bg2:#101828; --navy:#16233F; --ivory:#F4EFE6; --ivory2:rgba(244,239,230,.72); --muted:rgba(244,239,230,.5);
  --gold:#D9B66C; --gold2:#E9D6BF; --cognac:#8A5A3B; --wa:#3BD27A;
  --glass:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.04) 60%,rgba(255,255,255,.07));
  --gline:rgba(255,255,255,.22); --line:rgba(244,239,230,.12);
  --disp:'Messiri','Plex',serif; --body:'Plex',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ivory);font-family:var(--body);font-size:16px;line-height:1.6}
body{min-height:100dvh;overflow-x:hidden;background:radial-gradient(120% 60% at 50% -10%,#1A2A4A 0,rgba(10,15,26,0) 60%),var(--bg)}
button,input{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
.lat{direction:ltr;unicode-bidi:isolate}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--gline);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.05),0 24px 60px rgba(0,0,0,.35)}
.btn{border:0;border-radius:99px;padding:15px 26px;font-size:16px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#E8CC8A,var(--gold) 55%,#B8914A);color:#14100A;display:inline-flex;align-items:center;gap:10px;transition:transform .2s,box-shadow .2s;box-shadow:0 10px 30px rgba(217,182,108,.28),inset 0 1px 0 rgba(255,255,255,.5)}
.btn:active{transform:scale(.97)}
.btn .dot{width:26px;height:26px;border-radius:50%;background:#14100A;color:var(--gold);display:grid;place-items:center;font-size:13px}
.btn.light{background:var(--ivory);color:var(--bg);box-shadow:none}
.btn.light .dot{background:var(--bg);color:var(--ivory)}
/* nav */
.nav{display:flex;align-items:center;justify-content:space-between;padding-top:calc(env(safe-area-inset-top,0px) + 16px);position:relative;z-index:8}
.logo{display:flex;align-items:center;gap:9px}
.logo img{width:34px;height:34px;border-radius:50%;background:var(--ivory);padding:2px}
.logo b{font-family:var(--disp);font-weight:700;letter-spacing:2px;font-size:17px}
.logo small{display:block;font-size:8px;letter-spacing:3px;color:var(--gold);margin-top:-5px}
.links{display:none;gap:28px;font-size:13px;color:var(--ivory2)}
.round{width:42px;height:42px;border-radius:50%;color:var(--ivory);display:grid;place-items:center;cursor:pointer;font-size:16px}
/* hero stage */
.stage{position:relative;height:min(94dvh,860px);min-height:640px;perspective:1000px;overflow:hidden;margin-top:-64px;padding-top:64px}
.layer{position:absolute;inset:0;will-change:transform;transition:transform .25s cubic-bezier(.2,.7,.2,1)}
.photo{inset:-4%}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block;filter:brightness(.78) saturate(1.05)}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,15,26,.55) 0,rgba(10,15,26,0) 22%,rgba(10,15,26,0) 50%,rgba(10,15,26,.85) 82%,var(--bg) 100%),radial-gradient(90% 70% at 50% 40%,rgba(10,15,26,0) 40%,rgba(10,15,26,.7) 100%)}
.bigbg{display:flex;align-items:flex-start;justify-content:center;padding-top:16%;font-family:var(--disp);font-weight:700;font-size:clamp(90px,26vw,340px);line-height:.8;color:transparent;-webkit-text-stroke:1px rgba(233,214,191,.16);letter-spacing:2px;white-space:nowrap}
.rim{position:absolute;left:50%;top:62%;width:min(120vw,900px);height:320px;transform:translate(-50%,-50%);background:radial-gradient(50% 50% at 50% 50%,rgba(217,182,108,.22),rgba(217,182,108,0) 70%);filter:blur(10px)}
/* the floating glass card (ref: frosted card held in front of a person) */
.float{display:flex;align-items:flex-end;justify-content:center;padding-bottom:max(9%,64px);pointer-events:none}
.gcard{pointer-events:auto;width:min(100%,470px);border-radius:28px;padding:20px 22px 22px;position:relative;overflow:hidden;transform-style:preserve-3d;
  background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05) 55%,rgba(255,255,255,.09));
  -webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border:1px solid rgba(255,255,255,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1px rgba(255,255,255,.04),0 0 0 1px rgba(150,210,255,.06),0 0 28px rgba(150,210,255,.16),0 40px 90px rgba(0,0,0,.55)}
.gcard::before{content:"";position:absolute;inset:-40%;background:linear-gradient(105deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.16) 50%,rgba(255,255,255,0) 60%);transform:translateX(calc(var(--sx,0) * 30%));pointer-events:none}
.gcard::after{content:"";position:absolute;left:12%;right:12%;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(160,220,255,.9),transparent);filter:blur(.5px)}
.gtop{display:flex;align-items:center;gap:10px;position:relative}
.gtop img{width:44px;height:44px;border-radius:50%;background:var(--ivory);padding:2px;box-shadow:0 0 0 2px rgba(217,182,108,.55)}

/* ===== depth engine: pointer + device tilt + scroll ===== */
let depthOff=null;
function depth(stage){
  if(depthOff)depthOff(); if(!stage)return;
  const L=[...stage.querySelectorAll('[data-d]')]; let tx=0,ty=0,cx=0,cy=0,sy=0,raf,t0=performance.now(),user=false;
  const mv=e=>{const r=stage.getBoundingClientRect();tx=((e.clientX-r.left)/r.width-.5)*2;ty=((e.clientY-r.top)/r.height-.5)*2;user=true};
  const ori=e=>{if(e.gamma==null)return;tx=Math.max(-1,Math.min(1,e.gamma/25));ty=Math.max(-1,Math.min(1,(e.beta-45)/25));user=true};
  const sc=()=>{sy=scrollY};
  addEventListener('pointermove',mv);addEventListener('deviceorientation',ori);addEventListener('scroll',sc,{passive:true});
  const red=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const loop=t=>{ if(!user){const k=(t-t0)/1000;tx=Math.sin(k*.6)*.35;ty=Math.cos(k*.45)*.25}
    cx+=(tx-cx)*.07;cy+=(ty-cy)*.07;
    L.forEach(el=>{const d=+el.dataset.d;const s=red?0:1;
      const r=+(el.dataset.r||1);el.style.transform=`translate3d(${(-cx*d*9*s).toFixed(2)}px,${(-cy*d*8*s+sy*d*.18).toFixed(2)}px,${d*12}px) rotateY(${(cx*1.2*r*s).toFixed(2)}deg) rotateX(${(-cy*1.6*r*s).toFixed(2)}deg) scale(${1+Math.min(sy,600)/6000*d})`;el.style.setProperty('--sx',cx.toFixed(3))});
    raf=requestAnimationFrame(loop)};
  raf=requestAnimationFrame(loop);
  depthOff=()=>{cancelAnimationFrame(raf);removeEventListener('pointermove',mv);removeEventListener('deviceorientation',ori);removeEventListener('scroll',sc);depthOff=null};
}
function tiltCards(sel){document.querySelectorAll(sel).forEach(c=>{c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`rotateY(${x*10}deg) rotateX(${-y*10}deg) translateZ(10px)`});c.addEventListener('pointerleave',()=>c.style.transform='')})}

#${KEYWORD} · ${sc.letter} ${sc.tier}`}
async function saveLead(L,list){if(!LEAD_ENDPOINT||!LEAD_KEY.startsWith('ey'))return false;const sc=score();
  const row={name:A.name,phone:A.phone,email:A.email||null,city:A.city,area:A.area||null,heard:A.heard,occasion:A.occ,timeline:A.when,style:A.style,customer:A.cust,colors:(A.colors||[]).join(','),shirt:A.shirt,waist:A.waist,shoe:A.shoe,look:`${COLORS[L.s].n}/${COLORS[L.t].n}/${L.shoeN}`,items:Object.fromEntries(list.map(x=>[x.k,qty[x.k]])),score:sc.tot,tier:sc.letter,source:(location.hostname||'file').slice(0,100)};
  if(CRM_ENDPOINT){const n=nearest(),bn=(BRANCHES.find(b=>b.id===n)||{}).name||'';fetch(CRM_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...row,city_l:(CITY.find(c=>c[0]===A.city)||[])[1],heard_l:lbl('heard'),occ_l:OCC[A.occ].l,when_l:lbl('when'),style_l:lbl('style'),cust_l:lbl('cust'),colors_l:(A.colors||[]).map(k=>COLORS[k].n).join('، '),tier_l:sc.letter+' '+sc.tier,branch_l:bn})}).catch(()=>{})}
  try{const r=await fetch(LEAD_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json',apikey:LEAD_KEY,Authorization:'Bearer '+LEAD_KEY,Prefer:'return=minimal'},body:JSON.stringify(row)});return r.ok}catch(e){return false}}
/* ===== live recolour: neutral model + garment masks (R shirt, G trousers, B shoes+belt) ===== */
function dress(cv,cols){const ld=u=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=u});
  Promise.all([ld(BASE),ld(MASK),ld(BELT)]).then(([b,m,bt])=>{const W=cv.width,H=cv.height,x=cv.getContext('2d',{willReadFrequently:true});
    x.drawImage(m,0,0,W,H);const M=x.getImageData(0,0,W,H).data;x.drawImage(bt,0,0,W,H);const MB=x.getImageData(0,0,W,H).data;x.drawImage(b,0,0,W,H);const im=x.getImageData(0,0,W,H),P=im.data;
    const C=cols.map(h=>{const c=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);return{c,dark:(.299*c[0]+.587*c[1]+.114*c[2])<.5}}),REF=[.94,.80,.78,.78];
    for(let p=0;p<P.length;p+=4){const w0=M[p]/255,w1=M[p+1]/255,w2=M[p+2]/255,w3=MB[p]/255;if(w0+w1+w2+w3<.01)continue;
      const L=(.299*P[p]+.587*P[p+1]+.114*P[p+2])/255;let r=P[p]/255,g=P[p+1]/255,bb=P[p+2]/255;
      [w0,w1,w2,w3].forEach((w,k)=>{if(w<.01)return;const s=Math.min(1.25,L/REF[k]),sh=C[k].dark?Math.pow(s,1.6):s,hi=Math.max(0,s-1)*.6,c=C[k].c;
        r=r*(1-w)+Math.min(1,c[0]*sh+hi)*w;g=g*(1-w)+Math.min(1,c[1]*sh+hi)*w;bb=bb*(1-w)+Math.min(1,c[2]*sh+hi)*w});
      P[p]=r*255;P[p+1]=g*255;P[p+2]=bb*255}
    x.putImageData(im,0,0);cv.dataset.done='1'})}
/* ===== result ===== */
function result(){
  $('#fbar').hidden=true;const L=buildLook(),list=pieces(L),first=(A.name||'').split(/\s+/)[0],near=nearest();list.forEach(x=>{if(!(x.k in qty))qty[x.k]=x.q});
  const order=[...BRANCHES].sort((a,b)=>(b.id===near)-(a.id===near)),has=Object.keys(PRICES).length>0,sh=v=>['?','no'].includes(v)?'—':v.replace('4XL+','4XL');
  app.innerHTML=nav()+`<section class="stage rstage mstage" id="stage">
     <div class="layer bigbg lat" data-d="-.2">${({meet:'MEETING',wed:'WEDDING',job:'INTERVIEW',work:'OFFICE',fri:'FRIDAY',trav:'TRAVEL',uni:'WEEKEND'}[A.occ]||'BLUE.PEN')}</div>
     <div class="layer" data-d=".1"><div class="rim" style="top:70%"></div></div>
     <div class="mhead"><span class="k glass"><img src="${LOGO}" alt="">خطة ${first} · ${L.o.l}</span><h1>${L.o.look[0]} <em>${L.o.look[1]}</em></h1></div>
     <div class="layer model" data-d=".5"><div class="fig"><canvas id="mdl" width="765" height="2400" aria-label="الموديل لابس طقمك بألوانك"></canvas>
       <div class="tagg r" style="top:24%"><span class="dt"></span><span class="ln"></span><span class="pill glass"><i class="sw" style="width:16px;height:16px;background:${COLORS[L.s].c}"></i><span><b>${L.o.top}</b><small>${COLORS[L.s].n} · ${sh(A.shirt)}</small></span></span></div>
       <div class="tagg l" style="top:56%"><span class="dt"></span><span class="ln"></span><span class="pill glass"><i class="sw" style="width:16px;height:16px;background:${COLORS[L.t].c}"></i><span><b>${L.o.bottom}</b><small>${COLORS[L.t].n} · ${sh(A.waist)}</small></span></span></div>
       ${A.shoe!=='no'?`<div class="tagg r" style="top:80%"><span class="dt"></span><span class="ln"></span><span class="pill glass"><i class="sw" style="width:16px;height:16px;background:${L.shoe}"></i><span><b>${L.o.shoe}</b><small>${L.shoeN} · ${sh(A.shoe)}</small></span></span></div>`:''}
     </div></div>
     <div class="mai">صورة توضيحية بألوان طقمك</div>
   </section>
   <section class="sec wrap gut" style="padding-top:30px"><div class="cards">
     <div class="card glass"><h3><b class="lat">01</b>نصايح ليك انت</h3><ul class="tips">${tips(L).map(t=>`<li>${t}</li>`).join('')}</ul></div>
     <div class="card glass"><h3><b class="lat">02</b>القطع المقترحة</h3>${list.map(x=>`<div class="it"><div class="nm">${x.n}<small>${x.sub}</small></div><div class="step"><button data-k="${x.k}" data-d="1" aria-label="زيادة">+</button><output id="q_${x.k}" class="lat">${qty[x.k]}</output><button data-k="${x.k}" data-d="-1" aria-label="نقصان">−</button></div></div>`).join('')}
       <p class="note" id="pricebox">${has?'':'عرض السعر بيجيك من فريق Blue.pen في الواتساب، على حسب القطع والموديلات المتوفرة.'}</p></div></div></section>
   <section class="sec wrap gut" style="padding-top:50px"><div class="kick">تواصل مع فرعك</div><h2 class="h2">اختار فرعك<br>وطقمك بيكون جاهز</h2>
     <div class="br">${order.map((b,n)=>`<div class="bc glass ${b.id===near?'n1':''}"><div class="bg">${b.k}</div>${b.id===near?'<span class="near">الأقرب ليك</span>':''}<h4>${b.name}</h4><p>${b.addr}</p><div class="acts"><a class="w" data-b="${b.id}" target="_blank" rel="noopener">راسلهم في واتساب</a><a class="c" href="tel:+${b.wa}">0${b.wa.slice(3)}</a></div>${b.wa2?`<div class="acts2"><span>${b.wa2n}</span><a class="w" data-b="${b.id}" data-n="2" target="_blank" rel="noopener">واتساب</a><a class="c" href="tel:+${b.wa2}">0${b.wa2.slice(3)}</a></div>`:''}</div>`).join('')}</div>
     <div class="saved" id="saved"></div></section>
   <footer class="foot wrap gut"><button class="skip" id="redo">صمّم طقم تاني</button><span class="lat">© 2026 BLUE.PEN</span></footer>`;
  app.querySelector('.go').onclick=()=>{i=-1;render()};
  const upd=()=>{app.querySelectorAll('a.w').forEach(a=>{const b=BRANCHES.find(x=>x.id===a.dataset.b);a.href='https://wa.me/'+(a.dataset.n==='2'?b.wa2:b.wa)+'?text='+encodeURIComponent(waText(L,list,b))});
    if(has){let s=0;list.forEach(x=>s+=(PRICES[x.k]||0)*qty[x.k]);$('#pricebox').textContent=s?`تقدير مبدئي: ${s.toLocaleString('ar-SD')} جنيه (السعر النهائي من الفرع)`:'عرض السعر بيجيك من فريق Blue.pen في الواتساب.'}};
  app.querySelectorAll('.step button').forEach(bt=>bt.onclick=()=>{const k=bt.dataset.k;qty[k]=Math.max(0,Math.min(9,qty[k]+ +bt.dataset.d));$('#q_'+k).textContent=qty[k];upd()});
  $('#redo').onclick=()=>{for(const k in A)delete A[k];qty={};i=-1;render();scrollTo(0,0)};
  upd();scrollTo(0,0);depth($('#stage'));tiltCards('.bc');dress($('#mdl'),[COLORS[L.s].c,COLORS[L.t].c,A.shoe==='no'?'#2A2522':L.shoe,L.o.casual?(COLORS[L.t].light?'#5E3A22':'#1A1A1C'):(A.shoe==='no'?'#2A2522':L.shoe)]);
  window.__lead={A,score:score(),text:waText(L,list,order[0])};
  saveLead(L,list).then(ok=>{window.__saved=ok;if(ok)$('#saved').textContent='✓ حفظنا خطتك، وفريقنا ممكن يتواصل معاك.'});
}
render();
